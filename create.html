  <section class="page-header">
    <div class="container">
      <span class="tag">Formulir Digital</span>
      <h1>Pengajuan Pembuatan / Revisi SOP</h1>
      <p>Kirimkan draf prosedur baru atau usulan pembaruan standar kerja unit Anda.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="form-container" style="margin-top: 0;">
        <form id="requestForm">
          <div class="form-group">
            <label for="nama">Nama Pengaju</label>
            <input type="text" id="nama" required placeholder="Masukkan nama lengkap Anda">
          </div>
          <div class="form-group">
            <label for="divisi">Divisi / Departemen</label>
            <input type="text" id="divisi" required placeholder="Contoh: IT, Keuangan, Operasional, HRD">
          </div>
          <div class="form-group">
            <label for="judulSop">Judul Dokumen SOP</label>
            <input type="text" id="judulSop" required placeholder="Contoh: SOP Pemeliharaan Server Bulanan">
          </div>
          <div class="form-group">
            <label for="pesan">Ringkasan Alur Prosedur</label>
            <textarea id="pesan" rows="5" required placeholder="Tuliskan langkah-langkah utama atau poin revisi yang diusulkan..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary full-width">Kirim ke Tim Validasi</button>
          <p id="formMessage" class="form-msg text-center"></p>
        </form>
      </div>
    </div>
  </section>
